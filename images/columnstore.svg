<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0.5" y="0.5" width="879" height="419" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" font-weight="700" fill="#111827">Rowstore и columnstore на одном запросе</text>
<text x="24" y="52" font-size="13" fill="#374151" font-family="Consolas, 'DejaVu Sans Mono', monospace">SELECT SUM(Сумма) FROM Продажи WHERE Дата &gt;= '2024-03-01'</text>
<rect x="560" y="64" width="12" height="12" rx="2" fill="#3b82f6"/>
<text x="576" y="75" font-size="12" fill="#374151">Дата</text>
<rect x="636" y="64" width="12" height="12" rx="2" fill="#22c55e"/>
<text x="652" y="75" font-size="12" fill="#374151">Склад</text>
<rect x="712" y="64" width="12" height="12" rx="2" fill="#a855f7"/>
<text x="728" y="75" font-size="12" fill="#374151">Товар</text>
<rect x="788" y="64" width="12" height="12" rx="2" fill="#f97316"/>
<text x="804" y="75" font-size="12" fill="#374151">Сумма</text>
<rect x="16" y="88" width="336" height="316" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="32" y="112" font-size="15" font-weight="700" fill="#111827">Rowstore — построчно</text>
<rect x="40" y="128" width="288" height="66" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="50" y="142" font-size="11" fill="#6b7280">страница 1</text>
<rect x="56" y="148" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="148" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="148" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="148" width="62" height="12" fill="#f97316"/>
<rect x="56" y="163" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="163" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="163" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="163" width="62" height="12" fill="#f97316"/>
<rect x="56" y="178" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="178" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="178" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="178" width="62" height="12" fill="#f97316"/>
<rect x="40" y="204" width="288" height="66" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="50" y="218" font-size="11" fill="#6b7280">страница 2</text>
<rect x="56" y="224" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="224" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="224" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="224" width="62" height="12" fill="#f97316"/>
<rect x="56" y="239" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="239" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="239" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="239" width="62" height="12" fill="#f97316"/>
<rect x="56" y="254" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="254" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="254" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="254" width="62" height="12" fill="#f97316"/>
<rect x="40" y="280" width="288" height="66" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="50" y="294" font-size="11" fill="#6b7280">страница 3</text>
<rect x="56" y="300" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="300" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="300" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="300" width="62" height="12" fill="#f97316"/>
<rect x="56" y="315" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="315" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="315" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="315" width="62" height="12" fill="#f97316"/>
<rect x="56" y="330" width="62" height="12" fill="#3b82f6"/>
<rect x="120" y="330" width="62" height="12" fill="#22c55e"/>
<rect x="184" y="330" width="62" height="12" fill="#a855f7"/>
<rect x="248" y="330" width="62" height="12" fill="#f97316"/>
<text x="32" y="378" font-size="12.5" fill="#9a3412">Чтобы сложить Сумму, СУБД читает страницы</text>
<text x="32" y="396" font-size="12.5" fill="#9a3412">целиком — все колонки всех строк.</text>
<rect x="368" y="88" width="496" height="316" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="384" y="112" font-size="15" font-weight="700" fill="#111827">Columnstore — по колонкам, сжато</text>
<rect x="380" y="124" width="228" height="170" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="390" y="142" font-size="12" font-weight="700" fill="#374151">группа строк 1: январь–февраль</text>
<rect x="394" y="152" width="40" height="96" rx="4" fill="#3b82f6" fill-opacity="0.22"/>
<text x="414" y="262" font-size="11" text-anchor="middle" fill="#374151">Дата</text>
<rect x="446" y="152" width="40" height="96" rx="4" fill="#22c55e" fill-opacity="0.22"/>
<text x="466" y="262" font-size="11" text-anchor="middle" fill="#374151">Склад</text>
<rect x="498" y="152" width="40" height="96" rx="4" fill="#a855f7" fill-opacity="0.22"/>
<text x="518" y="262" font-size="11" text-anchor="middle" fill="#374151">Товар</text>
<rect x="550" y="152" width="40" height="96" rx="4" fill="#f97316" fill-opacity="0.22"/>
<text x="570" y="262" font-size="11" text-anchor="middle" fill="#374151">Сумма</text>
<text x="390" y="284" font-size="11.5" fill="#dc2626" font-weight="700">max(Дата) = 28.02 → пропущена</text>
<rect x="624" y="124" width="228" height="170" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<text x="634" y="142" font-size="12" font-weight="700" fill="#374151">группа строк 2: март</text>
<rect x="638" y="152" width="40" height="96" rx="4" fill="#3b82f6" fill-opacity="1" stroke="#111827" stroke-width="2"/>
<text x="658" y="262" font-size="11" text-anchor="middle" fill="#374151">Дата</text>
<rect x="690" y="152" width="40" height="96" rx="4" fill="#22c55e" fill-opacity="0.22"/>
<text x="710" y="262" font-size="11" text-anchor="middle" fill="#374151">Склад</text>
<rect x="742" y="152" width="40" height="96" rx="4" fill="#a855f7" fill-opacity="0.22"/>
<text x="762" y="262" font-size="11" text-anchor="middle" fill="#374151">Товар</text>
<rect x="794" y="152" width="40" height="96" rx="4" fill="#f97316" fill-opacity="1" stroke="#111827" stroke-width="2"/>
<text x="814" y="262" font-size="11" text-anchor="middle" fill="#374151">Сумма</text>
<text x="634" y="284" font-size="11.5" fill="#15803d" font-weight="700">читаются 2 сегмента из 4</text>
<rect x="380" y="306" width="472" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
<text x="392" y="322" font-size="12" font-weight="700" fill="#374151">Deltastore (обычное B-дерево)</text>
<text x="392" y="338" font-size="12" fill="#374151">мелкие вставки копятся здесь → tuple mover сжимает их в группу строк</text>
<text x="384" y="378" font-size="12.5" fill="#14532d">Segment elimination по min/max · только нужные колонки ·</text>
<text x="384" y="396" font-size="12.5" fill="#14532d">сжатие в 7–10 раз · пакетная обработка (batch mode)</text>
</svg>