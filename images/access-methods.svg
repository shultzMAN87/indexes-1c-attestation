<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect x="0.5" y="0.5" width="879" height="339" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#111827">Что выберет оптимизатор в зависимости от доли отбираемых строк</text>

  <!-- zones -->
  <rect x="60" y="56" width="240" height="66" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="180" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Поиск по индексу</text>
  <text x="180" y="96" font-size="12" text-anchor="middle" fill="#14532d">MS SQL: Index Seek + Key Lookup</text>
  <text x="180" y="112" font-size="12" text-anchor="middle" fill="#14532d">PG: Index Scan</text>

  <rect x="304" y="56" width="156" height="66" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="382" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Битовая карта</text>
  <text x="382" y="96" font-size="12" text-anchor="middle" fill="#1e3a8a">PG: Bitmap Index Scan</text>
  <text x="382" y="112" font-size="12" text-anchor="middle" fill="#1e3a8a">→ Bitmap Heap Scan</text>

  <rect x="464" y="56" width="356" height="66" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="642" y="78" font-size="14" font-weight="700" text-anchor="middle" fill="#7c2d12">Полное сканирование</text>
  <text x="642" y="96" font-size="12" text-anchor="middle" fill="#7c2d12">MS SQL: Clustered Index Scan / Table Scan</text>
  <text x="642" y="112" font-size="12" text-anchor="middle" fill="#7c2d12">PG: Seq Scan</text>

  <!-- axis -->
  <line x1="60" y1="150" x2="822" y2="150" stroke="#374151" stroke-width="1.5"/>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="60" y1="145" x2="60" y2="155"/>
    <line x1="140" y1="145" x2="140" y2="155"/>
    <line x1="260" y1="145" x2="260" y2="155"/>
    <line x1="380" y1="145" x2="380" y2="155"/>
    <line x1="520" y1="145" x2="520" y2="155"/>
    <line x1="670" y1="145" x2="670" y2="155"/>
    <line x1="820" y1="145" x2="820" y2="155"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="60" y="171">0%</text>
    <text x="140" y="171">0,1%</text>
    <text x="260" y="171">1%</text>
    <text x="380" y="171">5%</text>
    <text x="520" y="171">20%</text>
    <text x="670" y="171">50%</text>
    <text x="820" y="171">100%</text>
  </g>
  <text x="440" y="192" font-size="12" text-anchor="middle" fill="#6b7280">доля строк таблицы под условием (шкала нелинейная, границы зон условные)</text>

  <!-- examples -->
  <g stroke="#6b7280" stroke-dasharray="4 3">
    <line x1="66" y1="150" x2="66" y2="222"/>
    <line x1="312" y1="150" x2="312" y2="252"/>
    <line x1="815" y1="150" x2="815" y2="222"/>
  </g>
  <g font-size="13" fill="#111827">
    <text x="72" y="220">ИНН = '7701234567'</text>
    <text x="72" y="236" font-size="12" fill="#6b7280">одна строка из миллиона</text>
    <text x="318" y="250">Статус = 'Черновик' (2%)</text>
    <text x="318" y="266" font-size="12" fill="#6b7280">на границе: зависит от покрытия и статистики</text>
    <text x="809" y="220" text-anchor="end">ПометкаУдаления = Ложь (99%)</text>
    <text x="809" y="236" font-size="12" fill="#6b7280" text-anchor="end">индекс бесполезен</text>
  </g>

  <text x="24" y="300" font-size="13" fill="#374151">Через некластерный индекс каждая строка = отдельное случайное чтение страницы таблицы.</text>
  <text x="24" y="320" font-size="13" fill="#374151">Зона индекса шире, если индекс покрывающий (в таблицу не ходим), на SSD и при низком random_page_cost.</text>
</svg>
