<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="24" y="32" font-size="17" font-weight="700" fill="#111827">B-дерево (B+-tree): поиск значения 57</text>

  <!-- level labels -->
  <text x="524" y="88" font-size="13" fill="#6b7280">← уровень 1: корень</text>
  <text x="780" y="180" font-size="12" fill="#6b7280">← уровень 2:</text><text x="792" y="196" font-size="12" fill="#6b7280">промежут.</text>
  <text x="30" y="336" font-size="13" fill="#6b7280">↑ уровень 3, листья: все ключи по порядку, связаны в список</text>

  <!-- edges root -> intermediate -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="395" y1="104" x2="180" y2="160" marker-end="url(#arr)"/>
    <line x1="485" y1="104" x2="700" y2="160" marker-end="url(#arr)"/>
    <!-- intermediate -> leaves -->
    <line x1="135" y1="204" x2="71" y2="270" marker-end="url(#arr)"/>
    <line x1="180" y1="204" x2="163" y2="270" marker-end="url(#arr)"/>
    <line x1="225" y1="204" x2="255" y2="270" marker-end="url(#arr)"/>
    <line x1="395" y1="204" x2="347" y2="270" marker-end="url(#arr)"/>
    <line x1="485" y1="204" x2="531" y2="270" marker-end="url(#arr)"/>
    <line x1="655" y1="204" x2="623" y2="270" marker-end="url(#arr)"/>
    <line x1="700" y1="204" x2="715" y2="270" marker-end="url(#arr)"/>
    <line x1="745" y1="204" x2="807" y2="270" marker-end="url(#arr)"/>
  </g>
  <!-- search path -->
  <g stroke="#ea580c" stroke-width="3" fill="none">
    <line x1="440" y1="104" x2="440" y2="158" marker-end="url(#arrO)"/>
    <line x1="440" y1="204" x2="439" y2="268" marker-end="url(#arrO)"/>
    <line x1="439" y1="314" x2="439" y2="366" marker-end="url(#arrO)"/>
  </g>

  <!-- root -->
  <rect x="370" y="60" width="140" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="88" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600">40 │ 80</text>

  <!-- intermediate -->
  <rect x="110" y="160" width="140" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="188" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600">10 │ 25</text>
  <rect x="370" y="160" width="140" height="44" rx="6" fill="#dbeafe" stroke="#ea580c" stroke-width="2.5"/>
  <text x="440" y="188" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600">50 │ 65</text>
  <rect x="630" y="160" width="140" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="188" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600">90 │ 110</text>

  <!-- leaves -->
  <g font-size="14" text-anchor="middle" fill="#14532d">
    <rect x="30" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="71" y="297">1 5 8</text>
    <rect x="122" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="163" y="297">10 15 20</text>
    <rect x="214" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="255" y="297">25 30 35</text>
    <rect x="306" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="347" y="297">40 44 48</text>
    <rect x="398" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#ea580c" stroke-width="2.5"/>
    <text x="439" y="297">50 <tspan font-weight="700" fill="#c2410c">57</tspan> 60</text>
    <rect x="490" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="531" y="297">65 70 75</text>
    <rect x="582" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="623" y="297">80 84 88</text>
    <rect x="674" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="715" y="297">90 95 99</text>
    <rect x="766" y="270" width="82" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="807" y="297">110 115 118</text>
  </g>
  <!-- leaf links -->
  <g stroke="#16a34a" stroke-width="1.5">
    <line x1="113" y1="292" x2="121" y2="292"/>
    <line x1="205" y1="292" x2="213" y2="292"/>
    <line x1="297" y1="292" x2="305" y2="292"/>
    <line x1="389" y1="292" x2="397" y2="292"/>
    <line x1="481" y1="292" x2="489" y2="292"/>
    <line x1="573" y1="292" x2="581" y2="292"/>
    <line x1="665" y1="292" x2="673" y2="292"/>
    <line x1="757" y1="292" x2="765" y2="292"/>
  </g>

  <!-- row -->
  <rect x="314" y="368" width="250" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="439" y="393" font-size="13" text-anchor="middle" fill="#374151">строка таблицы (по ссылке из листа)</text>

  <!-- notes -->
  <text x="24" y="440" font-size="13" fill="#374151"><tspan font-weight="700" fill="#c2410c">Путь поиска:</tspan> корень → промежуточная страница → лист = 3 чтения страницы индекса.</text>
  <text x="24" y="460" font-size="13" fill="#374151">На странице 8 КБ — сотни ключей: при ветвлении ~300 три уровня адресуют ~27 млн строк.</text>
  <text x="600" y="393" font-size="12" fill="#6b7280">диапазон: дальше вправо</text>
  <text x="600" y="409" font-size="12" fill="#6b7280">по списку листьев</text>
</svg>
