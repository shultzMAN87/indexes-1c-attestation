    <rect x="622" y="100" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="634" y="100" width="12" height="12" fill="#ea580c" stroke="#ea580c" stroke-width="1.6"/>
    <rect x="646" y="100" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="434.0" y="160" width="112" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="490" y="176" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">узел N1</text>
    <rect x="442" y="184" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="454" y="184" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="466" y="184" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="478" y="184" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="490" y="184" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="502" y="184" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
