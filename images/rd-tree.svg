<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="599" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#111827">RD-дерево (GiST по tsvector): узел = сигнатура, OR всех сигнатур поддерева</text>
  <text x="30" y="62" font-size="12" fill="#6b7280" font-weight="600">1. Лексема → хеш → номер бита</text>
  <text x="30" y="78" font-size="11" fill="#6b7280">(на схеме 8 бит; в PostgreSQL по умолчанию</text>
  <text x="30" y="92" font-size="11" fill="#6b7280">siglen = 124 байта = 992 бита)</text>
  <g font-size="12" fill="#1f2937">
    <text x="34" y="122" fill="#1f2937">«страница»</text>
    <text x="112" y="122" fill="#6b7280">→ бит 0</text>
    <rect x="170" y="112" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="112" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="34" y="144" fill="#1f2937">«индекс»</text>
    <text x="112" y="144" fill="#6b7280">→ бит 1</text>
    <rect x="170" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="134" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="134" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="34" y="166" fill="#1f2937">«кеш»</text>
    <text x="112" y="166" fill="#6b7280">→ бит 3</text>
    <rect x="170" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="156" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="156" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="34" y="188" fill="#1f2937">«дерево»</text>
    <text x="112" y="188" fill="#6b7280">→ бит 4</text>
    <rect x="170" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="178" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="178" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="34" y="210" fill="#1f2937">«поиск»</text>
    <text x="112" y="210" fill="#6b7280">→ бит 6</text>
    <rect x="170" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="200" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="200" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="34" y="232" fill="#c2410c">«лист»</text>
    <text x="112" y="232" fill="#6b7280">→ бит 6</text>
    <rect x="170" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="222" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="222" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <text x="34" y="252" font-size="11" fill="#c2410c">«поиск» и «лист» попали в один бит —</text>
  <text x="34" y="266" font-size="11" fill="#c2410c">коллизия: индекс их не различает</text>
  <text x="30" y="292" font-size="12" fill="#6b7280" font-weight="600">2. Документ → OR битов его лексем</text>
  <text x="34" y="312" font-size="12" fill="#1f2937">«индекс дерево»</text>
    <rect x="170" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="182" y="302" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="194" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="206" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="218" y="302" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="230" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="242" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="254" y="302" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="34" y="334" font-size="11" fill="#6b7280">биты 1 и 4</text>
  <text x="30" y="362" font-size="12" fill="#6b7280" font-weight="600">3. Узел → OR сигнатур потомков</text>
  <text x="34" y="380" font-size="11" fill="#374151">Множество слов родителя содержит</text>
  <text x="34" y="394" font-size="11" fill="#374151">множества потомков, как матрёшка:</text>
  <text x="34" y="408" font-size="11" fill="#374151">Russian Doll tree.</text>
  <text x="350" y="62" font-size="12" fill="#6b7280" font-weight="600">Поиск <tspan font-family="ui-monospace, Consolas, monospace">tsv @@ 'поиск'</tspan> → проверяем бит 6 на каждом уровне</text>
  <rect x="554.0" y="76" width="112" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="610" y="92" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">корень</text>
    <rect x="562" y="100" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="574" y="100" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <rect x="586" y="100" width="12" height="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="598" y="100" width="12" height="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
