<line x1="332" y1="184" x2="370" y2="174" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
<text x="500" y="294" font-size="1" fill="#1f2937"></text>
<text x="560" y="356" font-size="12" fill="#b91c1c">↑ мало бакетов или повторы ключа: длинная цепочка</text>
<rect x="24" y="380" width="404" height="92" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="40" y="402" font-size="13" fill="#166534" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">WHERE SessionId = 42</text>
<text x="40" y="424" font-size="12.5" fill="#166534">вычислить бакет → пройти цепочку: 2 сравнения.</text>
<text x="40" y="444" font-size="12.5" fill="#166534">Нужны ВСЕ колонки ключа: хеш считается от всего ключа.</text>
<rect x="444" y="380" width="412" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="460" y="402" font-size="13" fill="#991b1b" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">WHERE SessionId BETWEEN 40 AND 50, ORDER BY</text>
<text x="460" y="424" font-size="12.5" fill="#991b1b">соседние ключи в разных бакетах — обход всех бакетов.</text>
<text x="460" y="444" font-size="12.5" fill="#991b1b">Для диапазонов — Bw-tree (некластерный индекс).</text>
