<rect x="0.5" y="0.5" width="879" height="493" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#111827">Hash-индекс In-Memory OLTP: ключ → бакет → цепочка строк</text>
<text x="24" y="54" font-size="11.5" fill="#374151" font-family="Consolas, 'DejaVu Sans Mono', monospace">CREATE TABLE … (SessionId int PRIMARY KEY NONCLUSTERED HASH WITH (BUCKET_COUNT = 8)) WITH (MEMORY_OPTIMIZED = ON)</text>
<text x="40" y="86" font-size="12" fill="#6b7280" font-weight="600">Ключ</text>
<text x="190" y="86" font-size="12" fill="#6b7280" font-weight="600">Хеш → номер бакета</text>
<text x="372" y="86" font-size="12" fill="#6b7280" font-weight="600">Бакеты (по 8 байт)</text>
<text x="500" y="86" font-size="12" fill="#6b7280" font-weight="600">Строки в памяти, связанные в цепочку</text>
<rect x="30" y="166" width="130" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="95" y="189" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700">SessionId = 42</text>
