<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="559" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#111827">MS SQL: страница данных 8 КБ и запись (строка таблицы)</text>

  <!-- ===== page ===== -->
  <text x="30" y="60" font-size="12" fill="#6b7280" font-weight="600">Страница = 8192 байта</text>
  <rect x="30" y="68" width="300" height="300" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="30" y="68" width="300" height="34" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="180" y="90" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">заголовок — 96 байт</text>
  <g font-size="11" fill="#1e3a8a">
    <rect x="40" y="110" width="280" height="30" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="129">запись 0 (слот 0)</text>
    <rect x="40" y="144" width="280" height="30" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="163">запись 1</text>
    <rect x="40" y="178" width="280" height="30" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="197">запись 2</text>
    <text x="180" y="226" font-size="12" text-anchor="middle" fill="#6b7280">↓ записи добавляются сюда</text>
  </g>
  <rect x="40" y="236" width="280" height="80" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="180" y="281" font-size="12" text-anchor="middle" fill="#6b7280">свободное место</text>
  <rect x="200" y="330" width="120" height="30" fill="#fef3c7" stroke="#d97706"/>
  <text x="260" y="349" font-size="11" text-anchor="middle" fill="#78350f">2 │ 1 │ 0</text>
  <text x="40" y="343" font-size="11" fill="#78350f">массив смещений →</text>
  <text x="40" y="357" font-size="11" fill="#78350f">(2 байта на запись)</text>
  <text x="30" y="388" font-size="12" fill="#374151">Под записи — до <tspan font-weight="700">8 060 байт</tspan>. Одна запись</text>
  <text x="30" y="404" font-size="12" fill="#374151">в строке <tspan font-weight="700">не может</tspan> быть больше и не делится</text>
  <text x="30" y="420" font-size="12" fill="#374151">между страницами.</text>

  <!-- ===== record ===== -->
  <text x="360" y="60" font-size="12" fill="#6b7280" font-weight="600">Запись (FixedVar)</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="360" y="70" width="52" height="46" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="386" y="89" fill="#111827">статус</text><text x="386" y="104" fill="#6b7280">4 Б</text>
    <rect x="412" y="70" width="120" height="46" fill="#dbeafe" stroke="#2563eb"/>
    <text x="472" y="89" fill="#1e3a8a">фиксированные</text><text x="472" y="104" fill="#1e3a8a">int, date, decimal…</text>
    <rect x="532" y="70" width="64" height="46" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="564" y="89" fill="#111827">NULL-</text><text x="564" y="104" fill="#111827">битмап</text>
    <rect x="596" y="70" width="80" height="46" fill="#fef3c7" stroke="#d97706"/>
    <text x="636" y="89" fill="#78350f">смещения</text><text x="636" y="104" fill="#78350f">переменных</text>
    <rect x="676" y="70" width="180" height="46" fill="#dcfce7" stroke="#16a34a"/>
    <text x="766" y="89" fill="#14532d">переменные колонки</text><text x="766" y="104" fill="#14532d">(значения или указатели)</text>
  </g>

  <!-- ===== allocation units ===== -->
  <text x="360" y="152" font-size="13" font-weight="700" fill="#111827">Куда уходит значение — три вида страниц (allocation units)</text>

  <rect x="360" y="166" width="496" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="372" y="186" font-size="13" font-weight="700" fill="#1d4ed8">IN_ROW_DATA</text>
  <text x="372" y="204" font-size="12" fill="#1e3a8a">Сама запись. Всё, что помещается в 8 060 байт, лежит здесь:</text>
  <text x="372" y="219" font-size="12" fill="#1e3a8a">фиксированные колонки, короткие строки, (max) до 8 000 байт.</text>

  <rect x="360" y="234" width="496" height="74" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="372" y="254" font-size="13" font-weight="700" fill="#a16207">ROW_OVERFLOW_DATA</text>
  <text x="372" y="272" font-size="12" fill="#713f12">Запись не влезает в 8 060 байт из-за колонок <tspan font-family="ui-monospace, Consolas, monospace">nvarchar(n)</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">varbinary(n)</tspan></tspan></text>
  <text x="372" y="288" font-size="12" fill="#713f12">(каждая ≤ 8 000 байт) → самые длинные переносятся сюда целиком,</text>
  <text x="372" y="303" font-size="12" fill="#713f12">в записи остаётся <tspan font-weight="700">указатель 24 байта</tspan>.</text>

  <rect x="360" y="318" width="496" height="104" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="372" y="338" font-size="13" font-weight="700" fill="#c2410c">LOB_DATA</text>
  <text x="372" y="356" font-size="12" fill="#7c2d12">Значения <tspan font-family="ui-monospace, Consolas, monospace">nvarchar(max)</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">varbinary(max)</tspan>, <tspan font-family="ui-monospace, Consolas, monospace">xml</tspan> больше 8 000 байт</text>
  <text x="372" y="372" font-size="12" fill="#7c2d12">(или не поместившиеся в запись) режутся на фрагменты до ~8 000 байт</text>
  <text x="372" y="388" font-size="12" fill="#7c2d12">на отдельных страницах. В записи — <tspan font-weight="700">корень 24–72 байта</tspan> (до 5 ссылок),</text>
  <text x="372" y="404" font-size="12" fill="#7c2d12">для больших значений — ссылка на дерево фрагментов (TEXT_TREE).</text>
  <text x="372" y="418" font-size="11.5" fill="#9a3412"><tspan font-family="ui-monospace, Consolas, monospace">ntext</tspan>/<tspan font-family="ui-monospace, Consolas, monospace">image</tspan>: по умолчанию <tspan font-weight="700">всегда</tspan> здесь (указатель 16 байт).</text>

  <!-- ===== bottom: example ===== -->
  <line x1="24" y1="442" x2="856" y2="442" stroke="#e5e7eb"/>
  <text x="30" y="464" font-size="13" font-weight="700" fill="#111827">Пример: строка с текстом 200 КБ в nvarchar(max)</text>
  <rect x="30" y="476" width="190" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="494" font-size="11.5" text-anchor="middle" fill="#1e3a8a">запись: ID, Title +</text>
  <text x="125" y="509" font-size="11.5" text-anchor="middle" fill="#1e3a8a">корень LOB (~24 байта)</text>
  <rect x="270" y="472" width="130" height="48" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="335" y="492" font-size="11.5" text-anchor="middle" fill="#7c2d12">TEXT_TREE</text>
  <text x="335" y="508" font-size="11" text-anchor="middle" fill="#7c2d12">список фрагментов</text>
  <g fill="#fed7aa" stroke="#ea580c">
    <rect x="450" y="470" width="62" height="22" rx="3"/><rect x="518" y="470" width="62" height="22" rx="3"/>
    <rect x="586" y="470" width="62" height="22" rx="3"/><rect x="654" y="470" width="62" height="22" rx="3"/>
    <rect x="450" y="498" width="62" height="22" rx="3"/><rect x="518" y="498" width="62" height="22" rx="3"/>
    <rect x="586" y="498" width="62" height="22" rx="3"/>
  </g>
  <text x="730" y="486" font-size="11.5" fill="#7c2d12">… ~26 страниц</text>
  <text x="730" y="502" font-size="11.5" fill="#7c2d12">по ~8 000 байт</text>
  <line x1="220" y1="496" x2="268" y2="496" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="400" y1="496" x2="448" y2="482" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="30" y="542" font-size="12" fill="#374151">Запрос без этой колонки читает только запись. <tspan font-family="ui-monospace, Consolas, monospace">SELECT *</tspan> или <tspan font-family="ui-monospace, Consolas, monospace">LIKE '%…%'</tspan> по ней — все ~26 LOB-страниц (lob logical reads).</text>
</svg>
