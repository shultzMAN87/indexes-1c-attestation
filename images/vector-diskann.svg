<text x="474" y="390" font-size="12" fill="#991b1b" font-weight="700">запрос @q</text>
<text x="137.59716566727798" y="86.80023582387358" font-size="12" fill="#1e3a8a" font-weight="700">входная точка</text>
<circle cx="588" cy="84" r="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="602" y="88" font-size="12" fill="#374151">входная точка</text>
<circle cx="588" cy="108" r="6" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
<text x="602" y="112" font-size="12" fill="#374151">раскрытые вершины (путь)</text>
<circle cx="588" cy="132" r="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="602" y="136" font-size="12" fill="#374151">кандидаты в списке</text>
<circle cx="588" cy="156" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
<text x="602" y="160" font-size="12" fill="#374151">ответ: 3 ближайших</text>
<circle cx="588" cy="180" r="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="602" y="184" font-size="12" fill="#374151">не посещались</text>
<text x="580" y="226" font-size="12" fill="#111827" font-weight="700">Шаг поиска:</text>
<text x="580" y="243" font-size="12" fill="#374151">взять ближайшего к @q нераскрытого</text>
<text x="580" y="260" font-size="12" fill="#374151">кандидата, добавить в список его</text>
<text x="580" y="277" font-size="12" fill="#374151">соседей, оставить L лучших.</text>
<text x="580" y="294" font-size="12" fill="#374151">Раскрывать нечего — список и есть</text>
<text x="580" y="311" font-size="12" fill="#374151">ответ.</text>
<text x="580" y="328" font-size="12" fill="#374151"></text>
<text x="580" y="345" font-size="12" fill="#374151">Ответ приближённый: шире список L —</text>
<text x="580" y="362" font-size="12" fill="#374151">выше recall, больше чтений.</text>
<text x="580" y="379" font-size="12" fill="#374151"></text>
