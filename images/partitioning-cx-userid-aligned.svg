<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0.5" y="0.5" width="879" height="465" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" fill="#111827" text-anchor="start" font-weight="700">Вариант 1. Кластерный индекс по UserID, выровненный</text>
<text x="24" y="56" font-size="13" fill="#4b5563" text-anchor="start">CREATE CLUSTERED INDEX … (UserID) ON psByMonth(VisitDate): сервер сам допишет дату в ключ → (UserID, VisitDate).</text>
<text x="24" y="76" font-size="13" fill="#4b5563" text-anchor="start">Каждая секция — своё дерево; внутри месяца строки упорядочены по UserID, а не по дате.</text>
<text x="24" y="104" font-size="12" fill="#6b7280" text-anchor="start">Секции (по месяцам):</text>
<text x="330" y="104" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Янв</text>
<text x="418" y="104" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Фев</text>
<text x="506" y="104" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Мар</text>
<text x="594" y="104" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">ещё 33</text>
<text x="24" y="136" font-size="13" fill="#111827" text-anchor="start" font-weight="700">Кластерный (UserID)</text>
<text x="24" y="154" font-size="12" fill="#6b7280" text-anchor="start">= сами данные, 36 деревьев</text>
<polygon points="330,118 299,158 361,158" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
