<text x="506" y="303" font-size="12" fill="#9ca3af" text-anchor="middle">—</text>
<rect x="555" y="278" width="78" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="594" y="303" font-size="12" fill="#9ca3af" text-anchor="middle">—</text>
<text x="650" y="294" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">Лучший случай:</text>
<text x="650" y="310" font-size="12" fill="#15803d" text-anchor="start">1 секция, 1 короткий спуск</text>
<text x="24" y="352" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">UserID = 42</text>
<text x="24" y="368" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">(без даты)</text>
<rect x="291" y="334" width="78" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
