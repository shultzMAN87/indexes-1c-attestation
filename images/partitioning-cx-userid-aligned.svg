<text x="506" y="359" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Seek</text>
<rect x="555" y="334" width="78" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
<text x="594" y="359" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Seek ×33</text>
<text x="650" y="350" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">36 спусков вместо одного:</text>
<text x="650" y="366" font-size="12" fill="#b91c1c" text-anchor="start">Scan count 36, ~100 чтений</text>
<rect x="16" y="392" width="848" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="32" y="414" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">SWITCH, TRUNCATE … PARTITIONS и обслуживание по секциям — работают</text>
<rect x="24" y="438" width="16" height="12" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="46" y="449" font-size="12" fill="#4b5563" text-anchor="start">не читается</text>
<rect x="135" y="438" width="16" height="12" rx="3" fill="#ffedd5" stroke="#ea580c"/>
<text x="157" y="449" font-size="12" fill="#4b5563" text-anchor="start">Scan — читается целиком</text>
<rect x="330" y="438" width="16" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
<text x="352" y="449" font-size="12" fill="#4b5563" text-anchor="start">Seek — спуск только к нужным строкам</text>
