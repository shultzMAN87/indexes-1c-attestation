<text x="506" y="247" font-size="12" fill="#9ca3af" text-anchor="middle">—</text>
<rect x="555" y="222" width="78" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="594" y="247" font-size="12" fill="#9ca3af" text-anchor="middle">—</text>
<text x="650" y="238" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">Читается весь февраль</text>
<text x="650" y="254" font-size="12" fill="#b45309" text-anchor="start">ради одного дня: 1/36 таблицы</text>
