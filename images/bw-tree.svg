<svg xmlns="http://www.w3.org/2000/svg" width="880" height="546" viewBox="0 0 880 546" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="545" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#111827">Bw-tree: некластерный индекс memory-optimized таблицы</text>
<text x="24" y="54" font-size="13" fill="#374151">Страницу не переписывают: изменение — delta-запись, указатель в таблице маппинга переключается атомарно (CAS).</text>
<text x="40" y="88" font-size="12.5" fill="#6b7280" font-weight="600">Таблица маппинга</text>
<rect x="40" y="98" width="120" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="56" y="117" font-size="12.5" fill="#1f2937" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 1</text>
<text x="150" y="117" font-size="11.5" fill="#6b7280" text-anchor="end">корень</text>
<rect x="40" y="132" width="120" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="56" y="151" font-size="12.5" fill="#1f2937" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 2</text>
<text x="150" y="151" font-size="11.5" fill="#6b7280" text-anchor="end">лист</text>
<rect x="40" y="166" width="120" height="28" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="56" y="185" font-size="12.5" fill="#9a3412" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 3</text>
<text x="150" y="185" font-size="11.5" fill="#6b7280" text-anchor="end">лист</text>
<rect x="40" y="200" width="120" height="28" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="56" y="219" font-size="12.5" fill="#1f2937" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 4</text>
<text x="150" y="219" font-size="11.5" fill="#6b7280" text-anchor="end">лист</text>
<rect x="200" y="92" width="300" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="350" y="117" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">корень: &lt;10→PID 2 | &lt;25→PID 3 | PID 4</text>
<line x1="160" y1="112" x2="198" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="510" y="106" font-size="11.5" fill="#6b7280">внутренние страницы ссылаются</text>
<text x="510" y="122" font-size="11.5" fill="#6b7280">на дочерние по PID, а не по адресу</text>
<text x="40" y="262" font-size="12.5" fill="#374151" font-weight="600">Было: вставили 15, удалили 9</text>
<path d="M160 182 C 190 182, 180 295, 210 295" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
<rect x="212" y="276" width="150" height="38" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="287" y="300" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">Δ insert 15</text>
<line x1="362" y1="295" x2="400" y2="295" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrO)"/>
<rect x="402" y="276" width="150" height="38" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="477" y="300" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">Δ delete 9</text>
<line x1="552" y1="295" x2="590" y2="295" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="592" y="276" width="250" height="38" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="717" y="300" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">страница: 3 · 9 · 12 · 20</text>
<text x="212" y="336" font-size="12" fill="#374151">① новая delta-запись указывает на текущую голову цепочки</text>
<text x="212" y="354" font-size="12" fill="#374151">② CAS: PID 3 → на неё. Не вышло (кто-то успел раньше) — повторить с новой головой.</text>
<text x="212" y="372" font-size="12" fill="#374151">③ Читатель идёт по цепочке: «15 есть», «9 нет», дальше — базовая страница.</text>
<text x="40" y="420" font-size="12.5" fill="#374151" font-weight="600">Стало: консолидация</text>
<rect x="40" y="430" width="120" height="28" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="56" y="449" font-size="12.5" fill="#9a3412" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 3</text>
<line x1="160" y1="444" x2="210" y2="444" stroke="#16a34a" stroke-width="2"/>
<line x1="200" y1="444" x2="212" y2="444" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
<rect x="214" y="425" width="250" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="339" y="449" font-size="13" fill="#166534" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">страница: 3 · 12 · 15 · 20</text>
<text x="490" y="436" font-size="12" fill="#374151">цепочка длинная (порядка 16 записей) → собрать новую</text>
<text x="490" y="454" font-size="12" fill="#374151">страницу и одним CAS переключить PID 3; старая цепочка</text>
<text x="490" y="472" font-size="12" fill="#374151">уходит сборщику мусора, когда её никто не читает.</text>
<rect x="24" y="496" width="832" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="40" y="518" font-size="12" fill="#374151">Умеет =, диапазоны, ORDER BY, левый префикс — но только в направлении индекса. Split и merge — тоже delta-записями.</text>
</svg>
