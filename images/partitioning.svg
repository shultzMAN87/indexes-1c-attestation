<text x="224" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#374151">Февраль</text>
<text x="224" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<polygon points="360,104 308.0,174 412.0,174" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="360" y="164" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">дерево</text>
<line x1="360" y1="176" x2="360" y2="204" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="304" y="206" width="112" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="360" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#374151">Март</text>
<text x="360" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<polygon points="656,100 486.0,174 826.0,174" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="656" y="164" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">одно дерево на всю таблицу</text>
<line x1="656" y1="176" x2="520" y2="204" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="464" y="206" width="112" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="520" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#374151">Январь</text>
<text x="520" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<line x1="656" y1="176" x2="656" y2="204" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="206" width="112" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="656" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#374151">Февраль</text>
<text x="656" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<line x1="656" y1="176" x2="792" y2="204" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="736" y="206" width="112" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="792" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#374151">Март</text>
<text x="792" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<text x="32" y="298" font-size="13" fill="#15803d" font-weight="700">✓</text>
<text x="52" y="298" font-size="13" fill="#374151">мгновенный SWITCH (MS SQL) / DETACH (PG)</text>
<text x="32" y="317" font-size="13" fill="#15803d" font-weight="700">✓</text>
<text x="52" y="317" font-size="13" fill="#374151">обслуживание отдельной секции</text>
<text x="32" y="336" font-size="13" fill="#15803d" font-weight="700">✓</text>
<text x="52" y="336" font-size="13" fill="#374151">отсечение секций, небольшие деревья</text>
<text x="32" y="355" font-size="13" fill="#c2410c" font-weight="700">✗</text>
<text x="52" y="355" font-size="13" fill="#374151">уникальный ключ обязан включать</text>
<text x="32" y="374" font-size="13" fill="#c2410c" font-weight="700"> </text>
<text x="52" y="374" font-size="13" fill="#374151">колонку секционирования</text>
<text x="32" y="393" font-size="13" fill="#c2410c" font-weight="700">✗</text>
<text x="52" y="393" font-size="13" fill="#374151">без условия по ней — поиск в каждом дереве</text>
<text x="464" y="298" font-size="13" fill="#15803d" font-weight="700">✓</text>
<text x="484" y="298" font-size="13" fill="#374151">уникальность по любой колонке</text>
<text x="464" y="317" font-size="13" fill="#15803d" font-weight="700">✓</text>
<text x="484" y="317" font-size="13" fill="#374151">один поиск без ключа секционирования</text>
<text x="464" y="336" font-size="13" fill="#c2410c" font-weight="700">✗</text>
<text x="484" y="336" font-size="13" fill="#374151">SWITCH невозможен</text>
<text x="464" y="355" font-size="13" fill="#c2410c" font-weight="700">✗</text>
<text x="484" y="355" font-size="13" fill="#374151">операции с секцией затрагивают весь индекс</text>
<text x="464" y="374" font-size="13" fill="#c2410c" font-weight="700">✗</text>
<text x="484" y="374" font-size="13" fill="#374151">обслуживание — только целиком</text>
</svg>