<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="419" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" font-weight="700" fill="#111827">Индексы на секционированной таблице (секции по месяцам)</text>
<rect x="16" y="44" width="416" height="366" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="448" y="44" width="416" height="366" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="32" y="68" font-size="15" font-weight="700" fill="#111827">Выровненный (локальный) индекс</text>
<text x="32" y="86" font-size="12" fill="#6b7280">MS SQL — по умолчанию; PostgreSQL — единственный вариант</text>
<text x="464" y="68" font-size="15" font-weight="700" fill="#111827">Невыровненный (глобальный) индекс</text>
<text x="464" y="86" font-size="12" fill="#6b7280">только MS SQL</text>
<polygon points="88,104 36.0,174 140.0,174" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="88" y="164" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">дерево</text>
