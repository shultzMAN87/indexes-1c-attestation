<text x="88" y="250" font-size="11" text-anchor="middle" fill="#6b7280">данные секции</text>
<polygon points="224,104 172.0,174 276.0,174" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="224" y="164" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="700">дерево</text>
