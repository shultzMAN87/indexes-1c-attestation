<text x="318" y="282" font-size="12" fill="#374151">Порядок верный, но внутри страниц</text>
<text x="318" y="299" font-size="12" fill="#374151">мёртвые версии и пустота: тех же данных</text>
<text x="318" y="316" font-size="12" fill="#374151">— в 2–3 раза больше страниц.</text>
<text x="318" y="333" font-size="12" fill="#374151">PG: pgstattuple → tuple_percent,</text>
<text x="318" y="350" font-size="12" fill="#374151">pgstatindex → avg_leaf_density</text>
