<text x="24" y="30" font-size="17" font-weight="700" fill="#111827">Раздувание и фрагментация — разные проблемы</text>
<text x="24" y="50" font-size="13" fill="#6b7280">Прямоугольник — страница файла (слева направо — физический порядок), подпись — логический порядок по ключу.</text>
