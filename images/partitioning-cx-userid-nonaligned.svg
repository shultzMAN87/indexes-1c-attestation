<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0.5" y="0.5" width="879" height="465" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" fill="#111827" text-anchor="start" font-weight="700">Вариант 2. Кластерный индекс по UserID, невыровненный (ON [PRIMARY])</text>
<text x="24" y="56" font-size="13" fill="#4b5563" text-anchor="start">Кластерный индекс — это и есть таблица. Он в одной файловой группе → таблица НЕ секционирована.</text>
<text x="24" y="76" font-size="13" fill="#4b5563" text-anchor="start">Функция и схема секционирования есть, но к данным отношения не имеют.</text>
<text x="24" y="104" font-size="12" fill="#6b7280" text-anchor="start">Секций нет — все данные в одном дереве:</text>
<text x="24" y="136" font-size="13" fill="#111827" text-anchor="start" font-weight="700">Кластерный (UserID)</text>
<text x="24" y="154" font-size="12" fill="#6b7280" text-anchor="start">= сами данные, 1 дерево</text>
<polygon points="462,118 288,158 636,158" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="462" y="173" font-size="11" fill="#5b21b6" text-anchor="middle">одно дерево по UserID на всю таблицу</text>
<line x1="16" y1="188" x2="864" y2="188" stroke="#e5e7eb"/>
<text x="24" y="206" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Запрос</text>
<text x="462" y="206" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Что читается</text>
<text x="650" y="206" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Итог</text>
<text x="24" y="240" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">VisitDate = '2026-02-15'</text>
<rect x="288" y="222" width="348" height="40" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
<text x="462" y="247" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">Scan всей таблицы — отсечения нет</text>
<text x="650" y="238" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">Читается вся таблица</text>
<text x="650" y="254" font-size="12" fill="#b91c1c" text-anchor="start">(если нет индекса по дате)</text>
<text x="24" y="296" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">UserID = 42</text>
<text x="24" y="312" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">AND VisitDate в феврале</text>
<rect x="288" y="278" width="348" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
<text x="462" y="303" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Seek по UserID, дата проверяется фильтром</text>
<text x="650" y="294" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">1 спуск в большом дереве</text>
<text x="24" y="352" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">UserID = 42</text>
<text x="24" y="368" font-size="12" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">(без даты)</text>
<rect x="288" y="334" width="348" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
<text x="462" y="359" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Seek по UserID</text>
<text x="650" y="350" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">1 спуск в большом дереве</text>
<rect x="16" y="392" width="848" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
<text x="32" y="414" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Секционирования фактически нет: ни SWITCH, ни TRUNCATE … PARTITIONS, ни отсечения</text>
<rect x="24" y="438" width="16" height="12" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="46" y="449" font-size="12" fill="#4b5563" text-anchor="start">не читается</text>
<rect x="135" y="438" width="16" height="12" rx="3" fill="#ffedd5" stroke="#ea580c"/>
<text x="157" y="449" font-size="12" fill="#4b5563" text-anchor="start">Scan — читается целиком</text>
<rect x="330" y="438" width="16" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
<text x="352" y="449" font-size="12" fill="#4b5563" text-anchor="start">Seek — спуск только к нужным строкам</text>
</svg>
