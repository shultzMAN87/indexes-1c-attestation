<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="32" font-size="17" font-weight="700" fill="#111827">Две вставки в одну страницу одновременно: CAS вместо очереди</text>
<text x="24" y="54" font-size="13" fill="#374151">Оба потока прочитали «PID 3 → A». Кто первым выполнил CAS, тот и опубликовал изменение; второй повторяет поверх.</text>

<text x="40" y="92" font-size="12.5" fill="#374151" font-weight="600">Шаг 1. Оба готовят delta-запись, обе указывают на A</text>
<rect x="40" y="104" width="120" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="56" y="124" font-size="12.5" fill="#1f2937" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 3 → A</text>
<rect x="250" y="104" width="150" height="30" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="325" y="124" font-size="12.5" fill="#9a3412" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">поток 1: +15</text>
<rect x="250" y="144" width="150" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="325" y="164" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">поток 2: +17</text>
<rect x="500" y="122" width="250" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="625" y="144" font-size="12.5" fill="#1f2937" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">A: страница 3 · 9 · 12 · 20</text>
<line x1="400" y1="119" x2="498" y2="133" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrO)"/>
<line x1="400" y1="159" x2="498" y2="146" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="40" y="214" font-size="12.5" fill="#374151" font-weight="600">Шаг 2. CAS «если PID 3 = A, поставь мою запись»</text>
<rect x="40" y="226" width="380" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="56" y="248" font-size="12.5" fill="#166534">Поток 1: в ячейке A → записал свою +15. Успех</text>
<rect x="440" y="226" width="400" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="456" y="248" font-size="12.5" fill="#991b1b">Поток 2: в ячейке уже не A → ничего не меняет. Отказ</text>

<text x="40" y="300" font-size="12.5" fill="#374151" font-weight="600">Шаг 3. Поток 2 перечитывает голову, цепляется за +15 и повторяет CAS — успех</text>
<rect x="40" y="312" width="120" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="56" y="332" font-size="12.5" fill="#9a3412" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">PID 3</text>
<line x1="160" y1="327" x2="198" y2="327" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="312" width="120" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="260" y="332" font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">Δ +17</text>
<line x1="320" y1="327" x2="358" y2="327" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="360" y="312" width="120" height="30" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="420" y="332" font-size="12.5" fill="#9a3412" text-anchor="middle" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">Δ +15</text>
<line x1="480" y1="327" x2="518" y2="327" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="520" y="310" width="250" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="645" y="332" font-size="12.5" fill="#1f2937" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace">A: страница 3 · 9 · 12 · 20</text>
<text x="40" y="374" font-size="12" fill="#374151">Читатель видит: 3 · 9 · 12 · 15 · 17 · 20. Обе вставки сохранились, никто не держал страницу и не стоял в очереди.</text>

<rect x="24" y="398" width="832" height="54" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="40" y="420" font-size="12" fill="#374151">В дисковом B-дереве поток 2 ждал бы, пока поток 1 отпустит latch страницы (PAGELATCH_EX).</text>
<text x="40" y="440" font-size="12" fill="#374151">Здесь ожидания нет, зато проигравший CAS делает немного работы заново. Lock-free — это «нет очереди», а не «нет конфликтов».</text>
</svg>
