<text x="44" y="404" font-size="13" fill="#374151"><tspan font-weight="700">Ключ</tspan> — на всех уровнях: по нему ищем и сортируем, входит в лимиты</text>
<rect x="24" y="412" width="14" height="14" fill="#ddd6fe"/>
<text x="44" y="424" font-size="13" fill="#374151"><tspan font-weight="700">INCLUDE</tspan> — только в листьях: только читаем, не влияет на уникальность и лимиты ключа</text>
