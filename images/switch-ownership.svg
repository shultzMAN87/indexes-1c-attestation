<text x="24" y="562" font-size="13" fill="#111827" text-anchor="start">Секция 2 и Orders_Stage обменялись наборами страниц: январь теперь «числится» за Orders_Stage,</text>
<text x="24" y="582" font-size="13" fill="#111827" text-anchor="start">а у секции 2 — пустой набор. Строки не копируются, в журнал пишется только изменение метаданных.</text>
<text x="24" y="606" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700">Проверить: hobt_id секции 2 до SWITCH совпадёт с hobt_id Orders_Stage после (sys.partitions).</text>
