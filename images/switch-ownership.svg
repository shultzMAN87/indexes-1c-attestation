<rect x="0.5" y="0.5" width="879" height="623" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" fill="#111827" text-anchor="start" font-weight="700">Что меняет SWITCH: владельца страниц, а не сами страницы</text>
<text x="24" y="54" font-size="13" fill="#111827" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace">ALTER TABLE dbo.Orders SWITCH PARTITION 2 TO dbo.Orders_Stage;</text>
