<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="349" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30" font-size="17" font-weight="700" fill="#111827">Секционированная таблица: снаружи одна, внутри — несколько секций</text>
<rect x="265" y="46" width="350" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="440" y="66" font-size="14" font-weight="700" text-anchor="middle" fill="#3730a3">dbo.Sales — для запросов одна таблица</text>
<text x="440" y="82" font-size="12" text-anchor="middle" fill="#4f46e5">INSERT и SELECT пишутся как обычно</text>
<line x1="440" y1="90" x2="132" y2="136" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="90" x2="332" y2="136" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="90" x2="532" y2="136" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="90" x2="732" y2="136" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="140" width="185" height="76" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 3"/>
<text x="132" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#374151">Секция 1</text>
<text x="132" y="182" font-size="12" text-anchor="middle" fill="#4b5563">всё, что раньше 01.01</text>
<text x="132" y="200" font-size="12" text-anchor="middle" fill="#9ca3af">пустая, «на всякий случай»</text>
<rect x="240" y="140" width="185" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="332" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Секция 2</text>
<text x="332" y="182" font-size="12" text-anchor="middle" fill="#1d4ed8">январь</text>
<text x="332" y="200" font-size="12" text-anchor="middle" fill="#6b7280">свои страницы и деревья</text>
<rect x="440" y="140" width="185" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="532" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Секция 3</text>
<text x="532" y="182" font-size="12" text-anchor="middle" fill="#1d4ed8">февраль</text>
<text x="532" y="200" font-size="12" text-anchor="middle" fill="#6b7280">свои страницы и деревья</text>
<rect x="640" y="140" width="200" height="76" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="740" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Секция 4</text>
<text x="740" y="182" font-size="12" text-anchor="middle" fill="#1d4ed8">март и всё, что позже</text>
<text x="740" y="200" font-size="12" text-anchor="middle" fill="#6b7280">свои страницы и деревья</text>
<line x1="40" y1="248" x2="846" y2="248" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<text x="852" y="252" font-size="12" fill="#6b7280">дата</text>
<line x1="232" y1="236" x2="232" y2="260" stroke="#ea580c" stroke-width="3"/>
<line x1="432" y1="236" x2="432" y2="260" stroke="#ea580c" stroke-width="3"/>
<line x1="632" y1="236" x2="632" y2="260" stroke="#ea580c" stroke-width="3"/>
<text x="232" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">01.01</text>
<text x="432" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">01.02</text>
<text x="632" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#c2410c">01.03</text>
<text x="24" y="310" font-size="13" fill="#111827">3 границы → 4 секции. RANGE RIGHT: граница — первый день секции справа (01.02 лежит в февральской секции 3).</text>
<text x="24" y="332" font-size="13" fill="#111827" font-family="Consolas, 'DejaVu Sans Mono', monospace">SELECT $PARTITION.pfByMonth('2024-02-15');  -- 3</text>
</svg>
