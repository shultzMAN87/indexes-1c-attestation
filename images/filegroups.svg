<text x="480" y="397" font-size="13" fill="#4b5563" text-anchor="middle">base.ldf — журнал транзакций: отдельный файл, ни в одну файловую группу не входит</text>
</g>
<text x="24" y="440" font-size="13" fill="#111827" text-anchor="start">Объект создаётся в файловой группе (CREATE TABLE … ON FG_Current), а не в файле: какой файл группы получит</text>
<text x="24" y="460" font-size="13" fill="#111827" text-anchor="start">страницу, решает SQL Server — пропорционально свободному месту. Секции раскладывает по группам схема секционирования.</text>
