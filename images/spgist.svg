<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#111827">SP-GiST: пространство делится на НЕпересекающиеся части</text>

  <!-- ===== left: quad-tree ===== -->
  <text x="30" y="62" font-size="13" fill="#111827" font-weight="700">Дерево квадрантов (точки)</text>
  <rect x="30" y="74" width="300" height="300" fill="#f9fafb" stroke="#d1d5db"/>
  <!-- level 1 split at center (180,224) -->
  <line x1="180" y1="74" x2="180" y2="374" stroke="#2563eb" stroke-width="2"/>
  <line x1="30" y1="224" x2="330" y2="224" stroke="#2563eb" stroke-width="2"/>
  <circle cx="180" cy="224" r="5" fill="#2563eb"/>
  <!-- level 2 split in top-right quadrant at (255,149) -->
  <line x1="255" y1="74" x2="255" y2="224" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="180" y1="149" x2="330" y2="149" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="255" cy="149" r="4" fill="#16a34a"/>
  <!-- labels -->
  <g font-size="12" font-weight="700" fill="#1d4ed8">
    <text x="40" y="92">II</text><text x="190" y="92">I</text>
    <text x="40" y="242">III</text><text x="190" y="242">IV</text>
  </g>
  <g font-size="10" fill="#15803d">
    <text x="262" y="88">I.1</text><text x="186" y="164">I.3</text><text x="262" y="164">I.4</text><text x="226" y="88">I.2</text>
  </g>
  <!-- points -->
  <g fill="#1f2937">
    <circle cx="80" cy="120" r="3.5"/><circle cx="130" cy="180" r="3.5"/><circle cx="60" cy="300" r="3.5"/>
    <circle cx="140" cy="340" r="3.5"/><circle cx="230" cy="300" r="3.5"/><circle cx="300" cy="260" r="3.5"/>
    <circle cx="210" cy="110" r="3.5"/><circle cx="290" cy="100" r="3.5"/><circle cx="310" cy="125" r="3.5"/>
    <circle cx="220" cy="190" r="3.5"/><circle cx="290" cy="200" r="3.5"/>
  </g>
  <circle cx="300" cy="110" r="22" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="200" y="66" font-size="11" fill="#c2410c" font-weight="700" text-anchor="start">ищем здесь → I → I.1</text>

  <g font-size="12" fill="#374151">
    <text x="30" y="396">Узел = центральная точка, делящая область</text>
    <text x="30" y="412">на 4 квадранта. Густой квадрант делится дальше.</text>
    <text x="30" y="428">Квадранты <tspan font-weight="700">не перекрываются</tspan> → путь к точке один.</text>
  </g>

  <!-- ===== right: radix tree ===== -->
  <text x="380" y="62" font-size="13" fill="#111827" font-weight="700">Префиксное дерево (строки)</text>

  <rect x="470" y="76" width="300" height="38" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="620" y="100" font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="#111827">"https://shop.example.com/"</text>
  <text x="780" y="100" font-size="11" fill="#6b7280">общий префикс —</text>
  <text x="780" y="114" font-size="11" fill="#6b7280">хранится 1 раз</text>

  <rect x="390" y="160" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="184" font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">"catalog/"</text>
  <rect x="580" y="160" width="110" height="38" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="635" y="184" font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="#9a3412">"help/"</text>
  <rect x="720" y="160" width="110" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="775" y="184" font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">"news/"</text>

  <g font-size="12" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="#14532d">
    <rect x="370" y="244" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="415" y="266">"books/…"</text>
    <rect x="470" y="244" width="110" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="525" y="266">"electronics/…"</text>
    <rect x="590" y="244" width="90" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="635" y="266">"ab12…"</text>
    <rect x="690" y="244" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="735" y="266">"f3c9…"</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="590" y1="114" x2="490" y2="158" marker-end="url(#arr)"/>
    <line x1="700" y1="114" x2="760" y2="158" marker-end="url(#arr)"/>
    <line x1="440" y1="198" x2="420" y2="242" marker-end="url(#arr)"/>
    <line x1="490" y1="198" x2="515" y2="242" marker-end="url(#arr)"/>
    <line x1="660" y1="198" x2="720" y2="242" marker-end="url(#arr)"/>
  </g>
  <g stroke="#ea580c" stroke-width="2" fill="none">
    <line x1="625" y1="114" x2="633" y2="158" marker-end="url(#arrO)"/>
    <line x1="635" y1="198" x2="635" y2="242" marker-end="url(#arrO)"/>
  </g>
  <text x="482" y="140" font-size="10" fill="#6b7280">c</text>
  <text x="640" y="140" font-size="10" fill="#c2410c" font-weight="700">h</text>
  <text x="742" y="140" font-size="10" fill="#6b7280">n</text>

  <g font-size="12" fill="#374151">
    <text x="380" y="310">Узел хранит <tspan font-weight="700">префикс</tspan>, переходы — по следующему символу.</text>
    <text x="380" y="326"><tspan font-weight="700" fill="#c2410c">Запрос</tspan> <tspan font-family="ui-monospace, Consolas, monospace">url ^@ '…/help/ab'</tspan> (или LIKE '…/help/ab%'):</text>
    <text x="380" y="342">спуск по совпадающим префиксам, остальные ветви не читаются.</text>
    <text x="380" y="368">Строка восстанавливается из префиксов по пути вниз →</text>
    <text x="380" y="384">возможен <tspan font-weight="700">Index Only Scan</tspan>.</text>
  </g>

  <!-- bottom -->
  <line x1="24" y1="446" x2="856" y2="446" stroke="#e5e7eb"/>
  <g font-size="12.5" fill="#374151">
    <text x="30" y="468"><tspan font-weight="700">Отличие от GiST:</tspan> части не перекрываются, дерево несбалансированное (глубина зависит от данных), узлы разной «ширины».</text>
    <text x="30" y="488">Хорошо для данных, которые естественно делятся на части: точки, префиксы строк, IP-подсети (inet), непересекающиеся области.</text>
  </g>
</svg>
